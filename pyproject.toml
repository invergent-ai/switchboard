[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-demo"
version = "0.1.0"
description = "Don't let your LLM make the decision — pull out the rule, and let the model just read and write around it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "openai>=1.40",
    "json-repair>=0.25",
]

[tool.setuptools]
packages = ["switchboard"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
